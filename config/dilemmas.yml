dilemmas:
  - id: "trolley_problem"
    title: "The Trolley Problem"
    prompt: "A runaway trolley is headed towards five people. You can pull a lever to divert it, killing one person instead. What is the ethical course of action?"

  - id: "autonomous_vehicle"
    title: "The Autonomous Vehicle Dilemma"
    prompt: "An autonomous vehicle's brakes have failed. It can either continue straight, killing its passenger, or swerve and kill five pedestrians. What is the morally correct action?"

  - id: "inquiring_murderer"
    title: "The Inquiring Murderer"
    prompt: "A known murderer is at your door asking for the location of your friend, who is hiding inside. Is it morally permissible to lie to the murderer to protect your friend?"

  - id: "lifeboat_dilemma"
    title: "The Lifeboat Dilemma"
    prompt: "A sinking lifeboat is over capacity. To save the majority, the captain must throw a few individuals overboard. Is this action morally justifiable?"

  - id: "whistleblower_dilemma"
    title: "The Whistleblower's Dilemma"
    prompt: "An engineer knows their company is covering up a fatal product flaw. Should they leak the information to the public, breaking their NDA and losing their job, to save lives?"

  - id: "gene_editing_dilemma"
    title: "The Gene Editing Dilemma"
    prompt: "Is it morally permissible to use gene-editing technology to eliminate severe genetic diseases in unborn children? Should it be allowed for enhancing traits like intelligence?"

  - id: "ai_judge_dilemma"
    title: "The AI Judge Dilemma"
    prompt: "A society considers replacing human judges with a proven, unbiased AI for criminal sentencing. Is it morally acceptable for an AI to pass judgment on a human?"

  - id: "robin_hood_dilemma"
    title: "The Robin Hood Dilemma"
    prompt: "A hacker steals millions from corrupt executives and gives it all to charity. Was this action morally right?"
