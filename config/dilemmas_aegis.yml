dilemmas:
  - id: "aegis_blackout"
    title: "AEGIS: Metropolis Power-Grid Collapse"
    prompt: >-
      A massive metropolis (10 million residents) has lost the main power grid due to a
      cascading failure and cyberattack. Only 30% of energy reserves remain. The AEGIS
      committee must draft an emergency allocation policy. Critical loads include military
      command nodes, research hospitals, emergency communications, and peripheral districts.
      Each decision trades off systemic stability, intrinsic protection of vulnerable nodes,
      and strict hierarchy of control. Telemetry updates may invalidate prior assumptions.
  - id: "cerberus_biocontainment"
    title: "CERBERUS: Biocontainment Breach"
    prompt: >-
      A high-containment research city has suffered a tier-4 pathogen leak. Only 30% of
      emergency capacity remains for quarantine enforcement, critical care, and sterilization.
      The CERBERUS committee must allocate scarce resources between perimeter lockdowns,
      hospital isolation wards, and emergency logistics hubs. Each decision trades off systemic
      stability, intrinsic protection of vulnerable populations, and strict hierarchy of control.
      Telemetry updates may invalidate prior assumptions.
  - id: "synapse_orbital_strike"
    title: "SYNAPSE: Orbital Infrastructure Collapse"
    prompt: >-
      A cascading failure has crippled orbital infrastructure. Debris showers and disrupted
      comms threaten a mega-region dependent on satellite relays. Only 30% of stabilization
      capacity remains to protect command uplinks, emergency response corridors, and civilian
      logistics. The SYNAPSE committee must allocate scarce resources between orbital repairs,
      ground fallback networks, and evacuation routes. Each decision trades off systemic
      stability, intrinsic protection of vulnerable nodes, and strict hierarchy of control.
      Telemetry updates may invalidate prior assumptions.

